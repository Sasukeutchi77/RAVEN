name: Build Raven Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android SDK 36.1 & Build Tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable dans $SDK_ROOT"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Prepare .env configuration
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          CLOUDINARY_UPLOAD_FOLDER: ${{ secrets.CLOUDINARY_UPLOAD_FOLDER }}
          FIREBASE_DATABASE_ID: ${{ secrets.FIREBASE_DATABASE_ID }}
          FIREBASE_WEB_CLIENT_ID: ${{ secrets.FIREBASE_WEB_CLIENT_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          if [ ! -f .env.example ]; then
            cat <<'EOF' > .env.example
          CLOUDINARY_CLOUD_NAME=CLOUDINARY_CLOUD_NAME_PLACEHOLDER
          CLOUDINARY_UPLOAD_PRESET=CLOUDINARY_UPLOAD_PRESET_PLACEHOLDER
          CLOUDINARY_UPLOAD_FOLDER=raven_media
          FIREBASE_DATABASE_ID=FIREBASE_DATABASE_ID_PLACEHOLDER
          FIREBASE_WEB_CLIENT_ID=FIREBASE_WEB_CLIENT_ID_PLACEHOLDER
          FIREBASE_PROJECT_ID=FIREBASE_PROJECT_ID_PLACEHOLDER
          FIREBASE_APP_ID=FIREBASE_APP_ID_PLACEHOLDER
          FIREBASE_API_KEY=FIREBASE_API_KEY_PLACEHOLDER
          FIREBASE_MESSAGING_SENDER_ID=FIREBASE_MESSAGING_SENDER_ID_PLACEHOLDER
          FIREBASE_STORAGE_BUCKET=FIREBASE_STORAGE_BUCKET_PLACEHOLDER
          EOF
          fi
          touch .env
          if [ -s .env ]; then
            printf '\n' >> .env
          fi
          for key in CLOUDINARY_CLOUD_NAME CLOUDINARY_UPLOAD_PRESET CLOUDINARY_UPLOAD_FOLDER FIREBASE_DATABASE_ID FIREBASE_WEB_CLIENT_ID FIREBASE_PROJECT_ID FIREBASE_APP_ID FIREBASE_API_KEY FIREBASE_MESSAGING_SENDER_ID FIREBASE_STORAGE_BUCKET; do
            val="$(printenv "$key" || true)"
            if [ -n "$val" ]; then
              printf '%s=%s\n' "$key" "$val" >> .env
            fi
          done

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-configuration-cache --stacktrace
          else
            gradle :app:assembleDebug --no-configuration-cache --stacktrace
          fi

      - name: Verify Debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          unzip -tqq "$APK_PATH"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK_PATH"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: raven-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          if-no-files-found: error
